plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.0'
}

group = 'cn.donting.javelin.game'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}
compileJava {
    options.release = 25
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.release = 25
    options.encoding = 'UTF-8'
}
dependencies {
    implementation 'cn.donting.javelin:javelin-core:0.1.0-SNAPSHOT'
    implementation 'cn.donting.javelin:javelin-log:0.1.0-SNAPSHOT'

    annotationProcessor 'cn.donting.javelin:javelin-ast:0.1.0-SNAPSHOT'
    compileOnly 'cn.donting.javelin:javelin-ast:0.1.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}


application {
    mainClass = 'cn.donting.javelin.core.GameMain'
    applicationName = project.name
}
// 新增：配置jar任务
jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    archiveFileName = "game.jar"
}

tasks.register('dumpRuntimeJars') {
    group = "custom"
    description = "输出 runtimeClasspath 所有依赖Jar路径到 build/dependencies.txt"
    doLast {
        def outputFile = file("build/dependencies.txt")
        outputFile.parentFile.mkdirs()

        def lines = configurations.runtimeClasspath.files.collect { file ->
            file.absolutePath
        }.sort()

        outputFile.text = lines.join(System.lineSeparator())
        println("依赖Jar列表已输出到: ${outputFile.absolutePath}")
        println("共 ${lines.size()} 个依赖文件")
    }
}
graalvmNative {
    binaries {
        main {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.matching("Oracle Corporation")
            }
            imageName = project.name
            mainClass = 'cn.donting.javelin.core.AotGameMain'
            debug = false
            verbose = false
            fallback = false
            sharedLibrary = false
            // 构建模式下发（编辑器打包 -PbuildMode）：debug→quickBuild 快速构建；缺省 release→全优化
            quickBuild = (project.findProperty('buildMode') ?: 'release') == 'debug'
            richOutput = false
            useFatJar = true
        }
    }
}

// 从 LWJGL natives JAR 提取 DLL 到 native image 输出目录的 lib/（外置——AotGameMain
// 设 org.lwjgl.librarypath=./lib 加载，防 natives 编译进 exe 导致体积膨胀，2026-10-13 拍板）
task extractLwjglNatives {
    def outputDir = layout.buildDirectory.dir("native/nativeCompile/lib").get().asFile
    outputs.dir(outputDir)

    doLast {
        outputDir.mkdirs()

        // 遍历所有配置，查找 lwjgl natives JAR
        project.configurations.each { cfg ->
            try {
                cfg.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    def jarFile = artifact.file
                    if (jarFile.name.endsWith(".jar") && jarFile.name.contains("natives-windows")) {
                        println "提取 natives JAR: ${jarFile.name}"
                        copy {
                            from zipTree(jarFile)
                            include "**/*.dll"
                            into outputDir
                            eachFile { fileCopyDetails ->
                                // 展平目录结构，直接把 dll 放到 lib/ 下
                                fileCopyDetails.path = fileCopyDetails.name
                            }
                            includeEmptyDirs = false
                        }
                    }
                }
            } catch (Exception e) {
                // 忽略未解析的配置
            }
        }

        println "提取 LWJGL natives 到: ${outputDir.absolutePath}"
        outputDir.listFiles()?.each { println "  - ${it.name}" }
    }
}

// 在 nativeCompile 完成后执行提取任务（DLL 不参与编译）
tasks.named('nativeCompile') {
    finalizedBy extractLwjglNatives
}

test {
    useJUnitPlatform()
}

