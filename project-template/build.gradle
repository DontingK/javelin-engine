plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.0'
}

group = 'com.javelin'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://central.sonatype.com/repository/maven-snapshots" }
    // JMonkeyEngine 仓库
    maven { url "https://jcenter.bintray.com" }
    mavenCentral()

}
compileJava {
    options.release = 25
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.release = 25
    options.encoding = 'UTF-8'
}
dependencies {
    implementation 'com.javelin:engine-core:1.0-SNAPSHOT'
    implementation 'com.javelin:engine-log:1.0-SNAPSHOT'

    annotationProcessor 'com.javelin:engine-ast:1.0-SNAPSHOT'
    compileOnly 'com.javelin:engine-ast:1.0-SNAPSHOT'

    compileOnly 'com.javelin:engine-ast:1.0-SNAPSHOT'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}


application {
    mainClass = 'com.javelin.core.GameMain'
    applicationName = project.name
}
// 新增：配置jar任务
jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    archiveFileName = "game.jar"
}

tasks.register('dumpRuntimeJars') {
    group = "custom"
    description = "输出 runtimeClasspath 所有依赖Jar路径到 build/dependencies.txt"
    doLast {
        def outputFile = file("build/dependencies.txt")
        outputFile.parentFile.mkdirs()

        def lines = configurations.runtimeClasspath.files.collect { file ->
            file.absolutePath
        }.sort()

        outputFile.text = lines.join(System.lineSeparator())
        println("依赖Jar列表已输出到: ${outputFile.absolutePath}")
        println("共 ${lines.size()} 个依赖文件")
    }
}
graalvmNative {
    binaries {
        main {
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.matching("Oracle Corporation")
            }
            imageName = project.name
            mainClass = 'com.javelin.core.GameMain'
            debug = false
            verbose = false
            fallback = false
            sharedLibrary = false
            quickBuild = false
            richOutput = false
            useFatJar = true
        }
    }
}

test {
    useJUnitPlatform()
}

