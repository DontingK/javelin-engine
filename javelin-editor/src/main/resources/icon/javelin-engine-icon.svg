<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="250" fill="#0a0f1e"/>

  <!-- ===== 极简几何标枪：粗壮大块面 ===== -->

  <!-- 枪身主面（白色大三角，占圆面积约 45%） -->
  <polygon points="80,256 432,136 432,376" fill="#f8fafc"/>

  <!-- 枪身暗面（青色大三角，与主面拼接成立体感） -->
  <polygon points="80,256 432,376 280,420" fill="#38bdf8"/>

  <!-- 尾翼（深青粗三角，增加尾部识别度） -->
  <polygon points="80,256 220,200 220,312" fill="#0ea5e9"/>
</svg>
