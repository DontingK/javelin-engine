plugins {
    id 'java'
    id 'application'
}

group = 'com.javelin'
version = '1.0-SNAPSHOT'

dependencies {
    // 从根项目继承平台版本管理
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl-shaderc"
    implementation "org.lwjgl:lwjgl-shaderc::$lwjglNatives"
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl::$lwjglNatives"
}

test {
    useJUnitPlatform()
}

// DebugText 调试文本资产生成 CLI（字库 bin + .spv）：
// gradlew :javelin-tool:run --args="<TTF/OTF 路径> <输出目录>"
application {
    mainClass = 'com.javelin.tool.debugtext.DebugTextAssets'
    // COMPAT=随系统控制台编码（GBK），避免 Java18+ 默认 UTF-8 在中文 Windows 控制台乱码；
    // 若改在 IDEA Run 窗口跑出现乱码则删掉这一条（IDEA 控制台默认 UTF-8）
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Djava.awt.headless=true', '-Dfile.encoding=COMPAT']
}

// GPU 拾取着色器资产生成 CLI（pick.spv，Engine_Picking_Design）：
// gradlew :javelin-tool:generatePickSpv [--args="<输出目录>"]
tasks.register('generatePickSpv', JavaExec) {
    mainClass = 'com.javelin.tool.pick.PickAssets'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dfile.encoding=COMPAT'
}
