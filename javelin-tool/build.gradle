plugins {
    id 'java'
}

group = 'cn.donting.javelin'

dependencies {
    // 从根项目继承平台版本管理
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl-shaderc"
    implementation "org.lwjgl:lwjgl-shaderc::$lwjglNatives"
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl::$lwjglNatives"
}

test {
    useJUnitPlatform()
}

// 本模块的内置资源生成 CLI 已全部清退（2026-11-07 内置资源迁移收官）：
// - DebugText 字库：原 DebugTextAssets CLI → 编辑器 BitmapFontImporter 从 .chars
//   字符集源码烘焙（光栅化器 DebugTextFontRasterizer 留驻本模块供导入链调用）；
// - debugline 着色器：原 DebugLineAssets CLI + generateDebugLineSpv 任务 → 源码
//   .vert/.frag 进 builtin-asset-editor/debugline 走 SpvShaderImporter 导入链。
// 故 application 插件、run 任务与 JavaExec 生成任务一并移除；本模块现为纯库
// （shaderc 编译封装 + 字库光栅化，供编辑器导入链与 core 测试调用）。
